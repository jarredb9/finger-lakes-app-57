name: Autonomous Issue Resolver

on:
  schedule:
    # 00:00 UTC = 20:00 EDT (overnight run)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Specific GitHub issue number to resolve (optional)'
        required: false
        type: string
      dry_run:
        description: 'Run in dry-run mode without pushing branches or updating issues'
        required: false
        type: boolean
        default: false

concurrency:
  group: agent-resolve-overnight
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  resolve-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Agent dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements-agent.txt

      - name: Configure Git user
        run: |
          git config --global user.name "Autonomous Agent (Gemini)"
          git config --global user.email "agent@jarredb9.github.com"

      - name: Run Autonomous Issue Resolver Harness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PLANNER_MODEL: ${{ vars.PLANNER_MODEL || 'gemini-3.8-flash-high' }}
          EXECUTOR_MODEL: ${{ vars.EXECUTOR_MODEL || 'gemini-3.8-flash-medium' }}
          MAX_TOKENS_PER_ISSUE: ${{ vars.MAX_TOKENS_PER_ISSUE || '500000' }}
          BATCH_PACING_SECONDS: ${{ vars.BATCH_PACING_SECONDS || '5' }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.issue_number }}" ]; then
            python3 scripts/agent-resolve.py --issue "${{ github.event.inputs.issue_number }}" $ARGS
          else
            python3 scripts/agent-resolve.py --max-issues 3 $ARGS
          fi
