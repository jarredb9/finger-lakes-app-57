name: Autonomous Issue Resolver

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  resolve-issue:
    # Security Gate: Only trigger when repository owner applies trigger label
    if: (github.event.label.name == 'agent:resolve' || github.event.label.name == 'ready-for-agent') && github.event.sender.login == 'jarredb9'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Aider
        run: |
          python3 -m pip install --upgrade pip
          pip install aider-chat

      - name: Configure Git user
        run: |
          git config --global user.name "Autonomous Agent (Gemini)"
          git config --global user.email "agent@jarredb9.github.com"

      - name: Prepare Issue Context and Branch
        id: prep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          BRANCH_NAME="agent/issue-${ISSUE_NUMBER}"
          git checkout -b "$BRANCH_NAME"

          # Extract issue payload safely
          gh issue view "$ISSUE_NUMBER" --json title,body,number > /tmp/issue.json

          # Construct prompt file with safe substitution to avoid bash expansion issues
          python3 -c "
          import json
          with open('/tmp/issue.json') as f:
              data = json.load(f)

          title = data.get('title', '')
          body = data.get('body', '')

          prompt = f'''You are an autonomous senior software engineer resolving a GitHub issue in this repository.

          REPOSITORY STANDARDS & INVARIANTS:
          1. Consult CONTEXT.md for domain language and architectural rules.
          2. Follow Test-Driven Development (TDD):
             - Write failing tests first.
             - Implement minimal code to pass tests and TypeScript checks.
             - Ensure all tests and type checks pass.
          3. Maintain documentation integrity and do not touch unrelated code.
          4. When changes are verified, commit following conventional commits format.

          ISSUE DETAILS:
          Issue #{data.get('number', '')}: {title}

          {body}
          '''

          with open('/tmp/agent_prompt.txt', 'w') as f:
              f.write(prompt)
          "

          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Run Aider TDD Loop with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AIDER_MODEL: ${{ vars.AGENT_MODEL || 'gemini/gemini-2.5-pro' }}
        run: |
          aider \
            --model "$AIDER_MODEL" \
            --message-file /tmp/agent_prompt.txt \
            --yes-always \
            --auto-commits \
            --test-cmd "npm run type-check && npm test" \
            --auto-test

      - name: Push Branch and Submit Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ steps.prep.outputs.branch_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # Verify that commits were made on the agent branch
          COMMITS_COUNT=$(git rev-list --count HEAD ^origin/main)
          if [ "$COMMITS_COUNT" -eq 0 ]; then
            echo "No commits were generated by the agent. Exiting without PR."
            gh issue comment "$ISSUE_NUMBER" --body "⚠️ Autonomous agent run completed, but no code changes were committed."
            exit 0
          fi

          git push origin "$BRANCH_NAME"

          ISSUE_TITLE=$(jq -r .title /tmp/issue.json)

          PR_BODY="## Summary
          Autonomous resolution for issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}

          Closes #${ISSUE_NUMBER}

          ## Evidence
          - Automated test cycle passed: \`npm run type-check && npm test\`.
          - Verified by CI workflow.

          ## Merge Danger
          - **Door:** Two-way
          - **Blast Radius:** Targeted to issue scope."

          gh pr create \
            --title "fix(issue-${ISSUE_NUMBER}): ${ISSUE_TITLE}" \
            --body "$PR_BODY" \
            --head "$BRANCH_NAME" \
            --base main

          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:resolve" --add-label "agent:in-review"
          gh issue comment "$ISSUE_NUMBER" --body "✅ Autonomous PR submitted for review on branch \`${BRANCH_NAME}\`."
