name: Autonomous Issue Resolver

on:
  schedule:
    # 00:00 UTC = 20:00 EDT (overnight run)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Specific GitHub issue number to resolve (optional)'
        required: false
        type: string
      dry_run:
        description: 'Run in dry-run mode without pushing branches or updating issues'
        required: false
        type: boolean
        default: false

concurrency:
  group: agent-resolve-overnight
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  resolve-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check GitHub App Configuration
        id: check-app
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo "has_app=true" >> $GITHUB_OUTPUT
          else
            echo "has_app=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate GitHub App Token
        id: app-token
        if: steps.check-app.outputs.has_app == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Determine Authentication Token
        id: auth
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          DEFAULT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$APP_TOKEN" ]; then
            echo "Authenticated via GitHub App Token (native downstream CI triggers enabled)."
            echo "token=$APP_TOKEN" >> $GITHUB_OUTPUT
          else
            echo "GitHub App credentials not detected; falling back to GITHUB_TOKEN."
            echo "token=$DEFAULT_TOKEN" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.auth.outputs.token }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Pull Docker Node Image for Sandboxed Verification
        run: docker pull node:24-slim || true

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements-agent.txt'

      - name: Install Agent dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements-agent.txt

      - name: Configure Git & Credentials
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          git config --global user.name "Autonomous Agent (Gemini)"
          git config --global user.email "agent@jarredb9.github.com"
          gh auth setup-git

      - name: Run Autonomous Issue Resolver Harness
        env:
          PYTHONUNBUFFERED: "1"
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PLANNER_MODEL: ${{ vars.PLANNER_MODEL || 'gemini-3.8-flash' }}
          EXECUTOR_MODEL: ${{ vars.EXECUTOR_MODEL || 'gemini-3.8-flash' }}
          MAX_TOKENS_PER_ISSUE: ${{ vars.MAX_TOKENS_PER_ISSUE || '500000' }}
          BATCH_PACING_SECONDS: ${{ vars.BATCH_PACING_SECONDS || '5' }}
          INPUT_ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=""
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "$INPUT_ISSUE_NUMBER" ]; then
            if ! [[ "$INPUT_ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
              echo "::error::Invalid issue_number: must be a positive integer"
              exit 1
            fi
            python3 -u scripts/agent-resolve/agent-resolve.py --issue "$INPUT_ISSUE_NUMBER" $ARGS
          else
            python3 -u scripts/agent-resolve/agent-resolve.py --max-issues 3 $ARGS
          fi

      - name: Upload Agent Diagnostic Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-diagnostics
          path: |
            diagnostic-artifacts/
            task-plan.md
            AGENT_HANDOFF.md
            .agent-state.json
            *.log
          if-no-files-found: ignore
