# Declarative repository configuration for conductor-tools.

[planning]
tracks_dir = "conductor/tracks"
archive_dir = "conductor/archive"
tracks_registry = "conductor/tracks.md"
style_guide_guardrail = "TypeScript Style Guardrails (conductor/code_styleguides/typescript.md): avoid `as` type assertions (prefer type guards/narrowing); avoid `_`-prefixed identifiers (use parameterless `catch {}`); use single quotes and explicit semicolons."
guardrail_extensions = [".ts", ".tsx"]

[type_check]
cmd = "npm run type-check"
extensions = [".ts", ".tsx"]
check_tokens = ["type-check", "check-types"]

[[suites]]
name = "integration"
full_cmd = "npm run test:integration:container"
targeted_cmd = "npm run test:integration:container -- {files}"
path_suffixes = [".integration.test.ts", ".integration.test.tsx", ".integration.test.js", ".integration.test.jsx"]
keywords = ["integration test", "integration"]
include_in_full_suite = false

[[suites]]
name = "unit"
full_cmd = "./scripts/containers/run-jest-container.sh"
targeted_cmd = "./scripts/containers/run-jest-container.sh {files}"
path_suffixes = [".test.ts", ".test.tsx", ".test.js", ".test.jsx"]
exclude_suffixes = [".integration.test.ts", ".integration.test.tsx", ".integration.test.js", ".integration.test.jsx"]
keywords = ["unit test", ".test."]
include_in_full_suite = true

[[suites]]
name = "e2e"
full_cmd = "./scripts/containers/run-e2e-container.sh webkit"
targeted_cmd = "./scripts/containers/run-e2e-container.sh webkit {files}"
path_prefixes = ["e2e/"]
path_suffixes = [".spec.ts", ".spec.tsx"]
keywords = ["e2e", "playwright"]
include_in_full_suite = false

[[suites]]
name = "edge_functions"
full_cmd = "npm run test:functions"
targeted_cmd = "npm run test:functions"
path_prefixes = ["supabase/functions/"]
keywords = ["edge function", "deno"]
include_in_full_suite = false

[[suites]]
name = "python_agent"
full_cmd = "npm run test:agent:all"
path_prefixes = ["scripts/"]
path_suffixes = [".py"]
keywords = ["python", "unittest"]
include_in_full_suite = false
is_python = true

[domains.ui]
priority = 30
path_prefixes = ["app/", "components/", "hooks/", "styles/", "public/", "e2e/"]
keywords = ["components/", "app/", "e2e/", "playwright", "modal", "ui "]
fallback_cmds = ["./scripts/containers/run-jest-container.sh", "npm run type-check"]
manual_verification_prompt = "UI / Frontend Phase: Present a concise manual verification checklist with exact browser steps (`http://localhost:3000`, target view/interaction, and expected visual outcome)."

[domains.database]
priority = 20
path_prefixes = ["supabase/", "scripts/db/"]
exact_paths = ["lib/database.types.ts"]
path_substrings = ["supabase-rpc"]
keywords = ["supabase/", "database.types.ts", "rls", "security invoker", "migration", "security advisor linter", "db:check-types", "config.toml"]
fallback_cmds = ["npm run db:check-types:local"]
manual_verification_prompt = "Database / Schema Phase (no UI changes — do NOT invent `localhost:3000` browser steps): Present a concise verification summary with 1–3 local CLI/SQL/linter spot-checks (e.g., `npm run db:lint`, `npx supabase db execute ...`, `npm run db:check-types:local`)."

[domains.backend_tooling]
priority = 10
path_prefixes = ["lib/", "scripts/", "types/"]
keywords = ["scripts/", "conductor", "tooling", "lib/"]
fallback_cmds = ["./scripts/containers/run-jest-container.sh", "npm run type-check"]
manual_verification_prompt = "Backend / Service / Tooling Phase (no UI changes — do NOT invent `localhost:3000` browser steps): Present a concise verification summary with 1–3 targeted CLI/grep/invariant spot-checks."

[exempt.ui]
commands = ["npm run build"]
commit_prefix = "style"
instruction = "- Verify application build passes cleanly with npm run build (UI exempt task)."

[exempt.styling]
commands = ["npm run build"]
commit_prefix = "style"
instruction = "- Verify application build passes cleanly with npm run build (Styling exempt task)."

[exempt.infra]
commands = ["npm run lint"]
commit_prefix = "chore"
instruction = "- Verify lint checks pass cleanly with npm run lint (Infra exempt task)."

[exempt.scripts]
commands = ["npm run lint"]
commit_prefix = "chore"
instruction = "- Verify lint checks pass cleanly with npm run lint (Scripts exempt task)."

[exempt.types]
commands = ["npm run type-check"]
commit_prefix = "types"
instruction = "- Verify TypeScript types pass cleanly with npm run type-check (Types exempt task)."

[exempt.docs]
commands = ["git diff --name-only"]
commit_prefix = "docs"
instruction = "- Verify documentation changes with git diff --name-only (Docs exempt task)."
diff_extensions = [".md", ".markdown"]
require_non_empty_diff = true

[paths]
test_dirs = ["__tests__", "tests", "test", "e2e"]
test_suffixes = [".test.ts", ".test.tsx", ".test.js", ".test.jsx", ".spec.ts", ".spec.tsx"]
test_prefixes = ["test_"]
metadata_prefixes = ["conductor/", ".conductor/", ".gemini/", ".claude/", ".agents/"]
code_prefixes = ["app/", "lib/", "components/", "supabase/", "hooks/", "types/", "public/", "scripts/", "src/", "pages/", "e2e/", "test/", "tests/", "styles/"]
code_extensions = [".ts", ".tsx", ".js", ".jsx", ".py", ".sql", ".css", ".html"]
manifest_files = ["package.json", "package-lock.json", "tsconfig.json", "pyproject.toml"]
ephemeral_patterns = ['^conductor/(?:tracks|archive)/[^/]+/(?:phase-\d+-task-\d+-plan\.md|phase-\d+-review\.md|logs(?:/.*)?)$']
log_patterns = ['^conductor/(?:tracks|archive)/[^/]+/logs(?:/.*)?$']

[supervisor]
static_analysis_prefixes = [
    "eslint",
    "tsc",
    "ruff",
    "mypy",
    "npx eslint",
    "npx tsc",
    "npm run lint",
    "npm run type-check",
    "npm run build",
    "npm run build:container",
    "./scripts/containers/run-build-container.sh",
]
default_test_cmd = "./scripts/containers/run-jest-container.sh"
full_suite_keywords = [
    "full automated",
    "full test suite",
    "full regression",
    "regression test execution",
    "regression verification",
    "type verification",
    "quality gates",
    "repository-wide verification",
]
conventional_commit_types = ["feat", "fix", "test", "refactor", "perf", "style", "chore", "docs", "types", "conductor"]
required_note_fields = ["Task:", "Summary:", "Files:", "Rationale:"]
review_severity_pattern = '^###\s+\[?(Critical|High)(?:\]|(?=$|[\s:]))'
default_timeout_seconds = 1800.0
default_heartbeat_interval = 30.0

[safety]
command_prefixes = ["npm ", "./scripts/", "npx ", "node ", "pytest ", "deno ", "python3", "python "]
allowed_verification_tokens = [
    "run-jest-container.sh",
    "test:container",
    "test:integration:container",
    "run-e2e-container.sh",
    "test:functions",
    "test:agent",
    "type-check",
    "check-types",
    "db:check-types",
    "db:status",
    "db:lint",
    "db:audit",
    "npm test",
    "npm run test",
    "npm run lint",
    "npm run build",
    "build:container",
    "python3",
    "python ",
    "pytest",
    "deno test",
    "npx eslint",
    "npx tsc",
    "npx playwright",
    "npx jest",
]
mutating_cmd_patterns = ['\b(db:reset|db:seed|db:gen-types|db:populate|db:start|db:stop|db:restart)\b']
mutating_git_prefixes = ["git add", "git commit", "git notes", "git push", "git checkout", "git reset", "rm "]

[models]
family = "gemini-4-hydrogen"
default_brain_dir = "~/.gemini/antigravity-cli/brain"

[models.efforts]
plan = "high"
exec = "high"
checkpoint = "medium"
review = "high"
